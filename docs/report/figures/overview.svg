<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210">
<defs><marker id="ah-ov" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.ov-t{font-size:11.5px;font-weight:600;fill:#12344d}.ov-s{font-size:10px;fill:#1f2933}.ov-m{font-size:9.5px;fill:#5d6b79}</style>
<!-- 1 person -->
<rect x="6" y="40" width="118" height="112" rx="8" fill="#f5f6f7" stroke="#6b7785"/>
<text x="65" y="62" text-anchor="middle" class="ov-t">1 · Person speaks</text>
<text x="65" y="84" text-anchor="middle" class="ov-s">"Hey Vayro …</text>
<text x="65" y="98" text-anchor="middle" class="ov-s">turn on the light"</text>
<text x="65" y="122" text-anchor="middle" class="ov-m">keyword, then a</text>
<text x="65" y="135" text-anchor="middle" class="ov-m">command</text>
<!-- 2 mic -->
<rect x="148" y="40" width="118" height="112" rx="8" fill="#eaf2fa" stroke="#1f5f8b"/>
<text x="207" y="62" text-anchor="middle" class="ov-t">2 · INMP441 mic</text>
<text x="207" y="84" text-anchor="middle" class="ov-s">sound → 24-bit</text>
<text x="207" y="98" text-anchor="middle" class="ov-s">digital samples</text>
<text x="207" y="122" text-anchor="middle" class="ov-m">16 000 samples/s</text>
<text x="207" y="135" text-anchor="middle" class="ov-m">over I2S (3 wires)</text>
<!-- 3 esp32 -->
<rect x="290" y="26" width="140" height="140" rx="8" fill="#eaf2fa" stroke="#1f5f8b" stroke-width="1.6"/>
<text x="360" y="48" text-anchor="middle" class="ov-t">3 · ESP32-S3 (edge)</text>
<text x="360" y="70" text-anchor="middle" class="ov-s">listens all the time</text>
<text x="360" y="84" text-anchor="middle" class="ov-s">40 log-mel features</text>
<text x="360" y="98" text-anchor="middle" class="ov-s">every 10 ms</text>
<text x="360" y="112" text-anchor="middle" class="ov-s">tiny CNN every 60 ms</text>
<text x="360" y="134" text-anchor="middle" class="ov-m">nothing is sent while</text>
<text x="360" y="147" text-anchor="middle" class="ov-m">no keyword is detected</text>
<!-- 4 network -->
<rect x="454" y="40" width="118" height="112" rx="8" fill="#f3eefb" stroke="#7a5aa6"/>
<text x="513" y="62" text-anchor="middle" class="ov-t">4 · Wi-Fi / TCP</text>
<text x="513" y="84" text-anchor="middle" class="ov-s">audio from 571 ms</text>
<text x="513" y="98" text-anchor="middle" class="ov-s">before detection</text>
<text x="513" y="112" text-anchor="middle" class="ov-s">+ the command</text>
<text x="513" y="135" text-anchor="middle" class="ov-m">32 kB/s, one warm link</text>
<!-- 5 server -->
<rect x="596" y="40" width="118" height="112" rx="8" fill="#eaf7ef" stroke="#2f7d4f"/>
<text x="655" y="62" text-anchor="middle" class="ov-t">5 · ASR server (PC)</text>
<text x="655" y="84" text-anchor="middle" class="ov-s">end of speech →</text>
<text x="655" y="98" text-anchor="middle" class="ov-s">Vosk recognises</text>
<text x="655" y="122" text-anchor="middle" class="ov-s" font-style="italic">"turn on the light"</text>
<text x="655" y="140" text-anchor="middle" class="ov-m">text output</text>
<line x1="124" y1="96" x2="146" y2="96" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ah-ov)"/>
<line x1="266" y1="96" x2="288" y2="96" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ah-ov)"/>
<line x1="430" y1="96" x2="452" y2="96" stroke="#1f2933" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-ov)"/>
<line x1="572" y1="96" x2="594" y2="96" stroke="#1f2933" stroke-width="1.3" marker-end="url(#ah-ov)"/>
<text x="360" y="14" text-anchor="middle" class="ov-m">dashed arrow = happens only after a keyword detection (true or false)</text>
<path d="M290,178 L430,178" stroke="#1f5f8b" stroke-width="1"/>
<text x="360" y="194" text-anchor="middle" class="ov-m">edge: decides WHEN to listen</text>
<path d="M596,178 L714,178" stroke="#2f7d4f" stroke-width="1"/>
<text x="714" y="194" text-anchor="end" class="ov-m">server: decides WHAT was said</text>
</svg>
