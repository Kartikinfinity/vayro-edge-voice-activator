<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280">
<defs><marker id="ah-wr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}.g-h{font-size:11px;font-weight:700;fill:#12344d}.g-t{font-size:9.8px;font-weight:600;fill:#12344d}.g-s{font-size:9px;fill:#1f2933}.g-m{font-size:8.4px;fill:#5d6b79}.g-e{fill:#eaf2fa;stroke:#1f5f8b}.g-o{fill:#f5f6f7;stroke:#6b7785}.pin{font-size:9.5px;font-weight:600;fill:#12344d}</style>
<!-- INMP441 -->
<rect x="20" y="40" width="160" height="190" rx="8" class="g-o"/>
<text x="100" y="30" text-anchor="middle" class="g-h">INMP441 breakout (TDK InvenSense)</text>
<text x="30" y="60" class="g-m">omnidirectional MEMS mic,</text>
<text x="30" y="72" class="g-m">I2S output, 24-bit</text>
<g class="pin"><text x="170" y="94" text-anchor="end">VDD</text><text x="170" y="119" text-anchor="end">GND</text><text x="170" y="144" text-anchor="end">SD</text><text x="170" y="169" text-anchor="end">L/R</text><text x="170" y="194" text-anchor="end">WS</text><text x="170" y="219" text-anchor="end">SCK</text></g>
<g fill="#1f2933"><circle cx="180" cy="90" r="3"/><circle cx="180" cy="115" r="3"/><circle cx="180" cy="140" r="3"/><circle cx="180" cy="165" r="3"/><circle cx="180" cy="190" r="3"/><circle cx="180" cy="215" r="3"/></g>
<!-- ESP32-S3 -->
<rect x="440" y="40" width="190" height="190" rx="8" class="g-e"/>
<text x="535" y="30" text-anchor="middle" class="g-h">ESP32-S3 board (N16R8 chip)</text>
<g class="pin"><text x="450" y="94">3V3</text><text x="450" y="119">GND</text><text x="450" y="144">GPIO4</text><text x="450" y="194">GPIO5</text><text x="450" y="219">GPIO6</text></g>
<g fill="#1f2933"><circle cx="440" cy="90" r="3"/><circle cx="440" cy="115" r="3"/><circle cx="440" cy="140" r="3"/><circle cx="440" cy="190" r="3"/><circle cx="440" cy="215" r="3"/></g>
<text x="500" y="144" class="g-s">I2S0 data in (DIN)</text>
<text x="500" y="194" class="g-s">I2S0 WS (master out)</text>
<text x="500" y="219" class="g-s">I2S0 BCK (master out)</text>
<text x="450" y="62" class="g-m">ESP32-S3 QFN56 rev 0.2, 16 MB flash,</text>
<text x="450" y="74" class="g-m">8 MB PSRAM (disabled in firmware)</text>
<text x="620" y="94" text-anchor="end" class="pin">GPIO15 ○</text><text x="620" y="119" text-anchor="end" class="pin">GPIO16 ○</text>
<text x="620" y="168" text-anchor="end" class="pin">USB ●</text>
<!-- wires -->
<path d="M180,90 L440,90" stroke="#c0392b" stroke-width="1.8"/>
<text x="310" y="85" text-anchor="middle" class="g-s">3.3 V supply</text>
<path d="M180,115 L440,115" stroke="#1f2933" stroke-width="1.8"/>
<text x="310" y="110" text-anchor="middle" class="g-s">ground</text>
<path d="M180,140 L436,140" stroke="#1f5f8b" stroke-width="1.8" marker-end="url(#ah-wr)"/>
<text x="330" y="135" text-anchor="middle" class="g-s">SD: serial data, mic → ESP (24 bits in a 32-bit slot)</text>
<path d="M180,165 L205,165 L205,115" stroke="#1f2933" stroke-width="1.8" fill="none"/>
<circle cx="205" cy="115" r="3" fill="#1f2933"/>
<text x="214" y="162" class="g-s">L/R tied to ground → mic uses the LEFT slot</text>
<path d="M440,190 L184,190" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#ah-wr)"/>
<text x="310" y="185" text-anchor="middle" class="g-s">WS: word select = 16 kHz sample clock</text>
<path d="M440,215 L184,215" stroke="#2f7d4f" stroke-width="1.8" marker-end="url(#ah-wr)"/>
<text x="310" y="210" text-anchor="middle" class="g-s">SCK: bit clock = 64 × 16 kHz = 1.024 MHz</text>
<path d="M630,165 L690,165 L690,258" stroke="#6b7785" stroke-width="1.4" fill="none" marker-end="url(#ah-wr)"/>
<text x="700" y="210" class="g-m" transform="rotate(-90 700 210)">to PC: power, COM7</text>
<text x="20" y="250" class="g-m">Source: firmware/sdkconfig.board (user-reported wiring 26 Sep, confirmed by the M1 measurements: the mic is in the left slot and the right slot reads 100 % zero).</text>
<text x="20" y="263" class="g-m">Not recorded in the repository: the SD pull-down resistor, the breakout's CHIPEN handling, the physical board model and whether a breadboard is used.</text>
<text x="20" y="276" class="g-m">GPIO15 / GPIO16 are driven by the firmware as instrumentation outputs but were never connected to a logic analyser.</text>
</svg>
