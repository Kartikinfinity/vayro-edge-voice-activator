<text x="8" y="256" class="g-m">Colour: blue = project code (Apache-2.0) · green = open third-party ML/DSP code · grey = ESP-IDF (open) · orange = closed Wi-Fi/PHY libraries.</text>
<text x="8" y="269" class="g-m">Line counts are of the .c/.cc source files in the repository at commit time of this report.</text>
<text x="8" y="282" class="g-m">Build-time gate: tools/forbidden_deps.py fails the build if any vendor wake-word SDK or pre-trained keyword model is referenced.</text>
