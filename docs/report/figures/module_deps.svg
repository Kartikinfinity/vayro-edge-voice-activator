<rect x="524" y="182" width="188" height="92" rx="4" fill="#ffffff" stroke="#b8591a" stroke-dasharray="3 2"/>
<text x="618" y="198" text-anchor="middle" class="g-t">Generated before each build</text>
<text x="532" y="213" class="g-s">ps_frontend_config.h ← frontend.json</text>
<text x="532" y="226" class="g-s">ps_frontend_tables.c ← host twin</text>
<text x="532" y="239" class="g-s">model_data.c ← model/artifacts/v2b</text>
